#cloud-config
hostname: cloud-defend-demo
manage_etc_hosts: true

users:
  - name: demo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    # scripts/create-vm.sh rewrites this file with your locally generated key
    ssh_authorized_keys: []

packages:
  - jq
  - curl
  - wget
  - openssh-server
  - clang-16
  - libbpf-dev
  - linux-headers-generic
  - build-essential
  - bpftool

write_files:
  - path: /etc/default/grub.d/99-bpf-lsm.cfg
    content: |
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT lsm=lockdown,capability,yama,apparmor,bpf"

runcmd:
  - update-grub
  - echo "VM ready" > /tmp/vm-ready
