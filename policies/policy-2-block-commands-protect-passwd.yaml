# Policy 2: Block Dangerous Commands and Protect /etc/passwd
#
# This policy blocks:
#   1. Execution of "ps" and "zcat" (by executable path)
#   2. All modifications to /etc/passwd (create, modify, delete)
#
# Note: processExecutable matches against the full path of the binary being
# exec'd (e.g., /usr/bin/ps), which is available at bprm_check_security time
# via the binprm->file->f_path. processName matches task->comm which is the
# calling process's name, not the new binary.
#
# Note on /etc/passwd protection:
#   Cloud-defend's file_open BPF hook only fires for files opened for
#   writing (FMODE_WRITE). The tool does not intercept file reads.

elasticsearch:
  api_key: "demo"
  hosts:
    - "http://localhost:9200"

indexes:
  alerts: logs-cloud_defend.alerts-default
  file: logs-cloud_defend.file-default
  process: logs-cloud_defend.process-default
  metrics: metrics-cloud_defend.metrics-default

package_policy:
  package_policy_id: ""
  package_policy_revision: 1

security-policy:
  version: "1.0.0"
  process:
    selectors:
      # Match exec of ps by executable path
      - name: blockPs
        operation: [ exec ]
        processExecutable: [ /usr/bin/ps ]
      # Match exec of zcat by executable path
      - name: blockZcat
        operation: [ exec ]
        processExecutable: [ /usr/bin/zcat, /bin/zcat ]
    responses:
      # Block and alert on ps execution
      - match: [ blockPs ]
        actions: [ block, alert ]
      # Block and alert on zcat execution
      - match: [ blockZcat ]
        actions: [ block, alert ]

  file:
    selectors:
      # Match any file operation targeting /etc/passwd
      - name: passwdModify
        operation: [ modifyFile ]
        targetFilePath: [ /etc/passwd ]
      - name: passwdDelete
        operation: [ deleteFile ]
        targetFilePath: [ /etc/passwd ]
      - name: passwdCreateExe
        operation: [ createExecutable ]
        targetFilePath: [ /etc/passwd ]
      - name: passwdModifyExe
        operation: [ modifyExecutable ]
        targetFilePath: [ /etc/passwd ]
    responses:
      - match: [ passwdModify ]
        actions: [ block, alert ]
      - match: [ passwdDelete ]
        actions: [ block, alert ]
      - match: [ passwdCreateExe ]
        actions: [ block, alert ]
      - match: [ passwdModifyExe ]
        actions: [ block, alert ]