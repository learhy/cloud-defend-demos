# Policy 2: Block Dangerous Commands and Protect /etc/passwd
#
# This policy blocks:
#   1. Execution of "ps" and "zcat" (by process name)
#   2. All modifications to /etc/passwd (create, modify, delete)
#
# Note on /etc/passwd protection:
#   Cloud-defend's file_open BPF hook only fires for files opened for
#   writing (FMODE_WRITE). The tool does not intercept file reads.
#   Therefore this policy blocks writes/modifications/deletions to
#   /etc/passwd, which prevents tampering with the user database.
#   Reads of /etc/passwd are not intercepted by the BPF-LSM hooks
#   that cloud-defend attaches to.
#
# When a blocked operation is attempted, the calling process receives
# EPERM (operation not permitted) and an alert event is generated.

elasticsearch:
  api_key: "demo"
  hosts:
    - "http://localhost:9200"

indexes:
  alerts: logs-cloud_defend.alerts-default
  file: logs-cloud_defend.file-default
  process: logs-cloud_defend.process-default
  metrics: metrics-cloud_defend.metrics-default

package_policy:
  package_policy_id: ""
  package_policy_revision: 1

security-policy:
  version: "1.0.0"
  process:
    selectors:
      # Match exec of "ps" (kernel task name / comm field)
      - name: blockPs
        operation: [ exec ]
        processName: [ ps ]
      # Match exec of "zcat"
      - name: blockZcat
        operation: [ exec ]
        processName: [ zcat ]
    responses:
      # Block and alert on ps execution
      - match: [ blockPs ]
        actions: [ block, alert ]
      # Block and alert on zcat execution
      - match: [ blockZcat ]
        actions: [ block, alert ]

  file:
    selectors:
      # Match any file operation targeting /etc/passwd
      - name: passwdModify
        operation: [ modifyFile ]
        targetFilePath: [ /etc/passwd ]
      # Match deletion of /etc/passwd
      - name: passwdDelete
        operation: [ deleteFile ]
        targetFilePath: [ /etc/passwd ]
      # Match creation of executables at /etc/passwd (attack: replace passwd with binary)
      - name: passwdCreateExe
        operation: [ createExecutable ]
        targetFilePath: [ /etc/passwd ]
      # Match modification of /etc/passwd if it's an executable
      - name: passwdModifyExe
        operation: [ modifyExecutable ]
        targetFilePath: [ /etc/passwd ]
    responses:
      # Block and alert on any modification to /etc/passwd
      - match: [ passwdModify ]
        actions: [ block, alert ]
      # Block and alert on deletion of /etc/passwd
      - match: [ passwdDelete ]
        actions: [ block, alert ]
      # Block and alert on creating an executable at /etc/passwd
      - match: [ passwdCreateExe ]
        actions: [ block, alert ]
      # Block and alert on modifying /etc/passwd as an executable
      - match: [ passwdModifyExe ]
        actions: [ block, alert ]